<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股全市場 ICT / SMC 量化即時選股引擎</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #080c14; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    .bg-panel { background: rgba(13, 20, 36, 0.85); backdrop-filter: blur(8px); border: 1px solid #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 space-y-6">

  <!-- 頂部狀態列 -->
  <header class="bg-panel rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 border border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="p-2.5 bg-cyan-950/80 border border-cyan-500/40 rounded-lg text-cyan-400">
        <i data-lucide="candlestick-chart" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
          台股全市場 SMC 聰明錢結構篩選
          <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">真實日 K 連線中</span>
        </h1>
        <p class="text-xs text-slate-400">涵蓋半導體、特化、綠能、散熱、機器人中小型潛力標的 · 動態識別 FVG / MSS</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="scanAllStocks()" id="btn-scan" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-semibold text-xs flex items-center gap-1.5 transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="scan-icon"></i> 執行全市場 SMC 實盤掃描
      </button>
    </div>
  </header>

  <!-- 主分析佈局 -->
  <main class="grid grid-cols-1 xl:grid-cols-12 gap-6">
    
    <!-- 左側：SMC 篩選結果列表 (7 欄) -->
    <section class="xl:col-span-7 space-y-4">
      <div class="bg-panel rounded-xl border border-slate-800 overflow-hidden">
        <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-900/60">
          <div class="text-xs font-semibold text-slate-300 flex items-center gap-2">
            <i data-lucide="filter" class="w-4 h-4 text-cyan-400"></i> SMC 結構符合清單
            <span id="scan-status" class="text-[11px] text-slate-500 font-normal">等待啟動掃描...</span>
          </div>
          <div class="text-[11px] text-slate-400 font-mono" id="result-count">共 0 檔符合</div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 uppercase tracking-wider border-b border-slate-800 font-mono">
              <tr>
                <th class="py-2.5 px-3">代號 / 標的</th>
                <th class="py-2.5 px-2">最新收盤</th>
                <th class="py-2.5 px-2">SMC 結構</th>
                <th class="py-2.5 px-2">FVG 缺口區間</th>
                <th class="py-2.5 px-2">結構止損 (SL)</th>
                <th class="py-2.5 px-2 text-right">風盈比 (R:R)</th>
              </tr>
            </thead>
            <tbody id="stock-table-body" class="divide-y divide-slate-800/60 font-mono">
              <tr>
                <td colspan="6" class="py-12 text-center text-slate-500 font-sans text-xs">
                  點擊右上角「執行全市場 SMC 實盤掃描」以拉取最新日 K 數據並計算
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 右側：真實近 30 天走勢與 SMC 標註 (5 欄) -->
    <section class="xl:col-span-5 space-y-4">
      <div class="bg-panel rounded-xl p-4 border border-slate-800 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div>
            <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2" id="chart-title">
              <span class="text-cyan-400 font-mono" id="chart-symbol">-- 請選擇標的 --</span>
            </h3>
            <p class="text-xs text-slate-400 mt-0.5" id="chart-desc">近 30 個交易日真實 K 線走勢</p>
          </div>
          <div class="text-right">
            <div class="text-base font-bold font-mono text-slate-100" id="chart-price">NT$ --</div>
            <div class="text-[11px] font-mono text-emerald-400" id="chart-fvg-tag">未有缺口</div>
          </div>
        </div>

        <div class="relative h-64 w-full">
          <canvas id="realtimeChart"></canvas>
        </div>

        <!-- SMC 點位量化說明 -->
        <div class="p-3 bg-slate-900/60 rounded-lg border border-slate-800 space-y-2 text-xs">
          <div class="text-slate-300 font-medium flex items-center gap-1.5">
            <i data-lucide="shield" class="w-3.5 h-3.5 text-cyan-400"></i> SMC 交易執行計畫
          </div>
          <div class="text-slate-400 space-y-1 font-sans" id="plan-details">
            <p>• 點選左側表格中的任一股票即可載入該標的的 30 日走勢與 SMC 關鍵點位分析。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 包含中小型股、特化、綠能、機器人、網通與各產業台股代表池（非僅大型權值股）
    const TW_WATCHLIST = [
      { symbol: "2330", name: "台積電" },
      { symbol: "3017", name: "奇鋐" },
      { symbol: "3324", name: "雙鴻" },
      { symbol: "2383", name: "台光電" },
      { symbol: "6274", name: "台燿" },
      { symbol: "3443", name: "創意" },
      { symbol: "3661", name: "世芯-KY" },
      { symbol: "4763", name: "材料-KY" },
      { symbol: "1519", name: "華城" },
      { symbol: "1513", name: "中興電" },
      { symbol: "8996", name: "高力" },
      { symbol: "2359", name: "所羅門" },
      { symbol: "4583", name: "台灣精銳" },
      { symbol: "6442", name: "光聖" },
      { symbol: "3131", name: "弘塑" },
      { symbol: "3583", name: "辛耘" },
      { symbol: "5483", name: "中美晶" },
      { symbol: "6188", name: "廣明" }
    ];

    let chartInstance = null;
    let analyzedResults = [];

    // 抓取真實 30 天日 K 資料（透過 Yahoo Finance 開放代理端點）
    async function fetchRealKlines(symbol) {
      const ticker = symbol + ".TW";
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=2mo&interval=1d`;
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      const raw = await res.json();
      const parsed = JSON.parse(raw.contents);
      
      const timestamps = parsed.chart.result[0].timestamp;
      const quote = parsed.chart.result[0].indicators.quote[0];

      const klines = [];
      for (let i = 0; i < timestamps.length; i++) {
        if (quote.close[i] !== null && quote.open[i] !== null) {
          klines.push({
            date: new Date(timestamps[i] * 1000).toLocaleDateString("zh-TW", { month: "2-digit", day: "2-digit" }),
            open: quote.open[i],
            high: quote.high[i],
            low: quote.low[i],
            close: quote.close[i],
            volume: quote.volume[i]
          });
        }
      }
      return klines.slice(-30); // 保留近 30 根 K 線
    }

    // ICT SMC 演算法計算核心
    function analyzeSMC(stock, klines) {
      if (klines.length < 15) return null;
      const n = klines.length;
      const current = klines[n - 1];
      const prev1 = klines[n - 2];
      const prev2 = klines[n - 3];

      // 1. 偵測日線級別多頭 FVG (Fair Value Gap)
      // 條件：前2根的高點 低於 當根低點 (Low[t] > High[t-2])
      let hasFVG = false;
      let fvgTop = 0;
      let fvgBottom = 0;
      for (let i = n - 1; i >= n - 5; i--) {
        if (klines[i].low > klines[i - 2].high) {
          hasFVG = true;
          fvgTop = Math.round(klines[i].low * 10) / 10;
          fvgBottom = Math.round(klines[i - 2].high * 10) / 10;
          break;
        }
      }

      // 2. 結構突破 (MSS / CHoCH)
      // 近 15 日最高收盤
      const swingHigh = Math.max(...klines.slice(-15, -1).map(k => k.high));
      const swingLow = Math.min(...klines.slice(-15, -1).map(k => k.low));
      const hasMSS = current.close > swingHigh * 0.985; // 接近或突破前高

      // 3. 折價區 (Discount Zone)
      const range = swingHigh - swingLow;
      const eq = swingLow + range * 0.5;
      const isDiscount = current.close <= eq;

      // 4. 計算交易點位 (SL 放在波段低點或前低之下)
      const sl = Math.round((swingLow * 0.98) * 10) / 10;
      const risk = current.close - sl;
      const target = Math.round((swingHigh * 1.08) * 10) / 10;
      const reward = target - current.close;
      const rr = risk > 0 ? (reward / risk).toFixed(2) : "0.00";

      return {
        symbol: stock.symbol,
        name: stock.name,
        currentPrice: Math.round(current.close * 10) / 10,
        hasFVG,
        fvgRange: hasFVG ? `${fvgBottom} ~ ${fvgTop}` : "無顯著缺口",
        hasMSS,
        structure: hasMSS ? "MSS 向上破位" : (hasFVG ? "FVG 回測吸籌" : "區間震盪整理"),
        isDiscount,
        sl,
        tp: target,
        rr,
        klines
      };
    }

    // 執行全市場掃描
    async function scanAllStocks() {
      const btn = document.getElementById("btn-scan");
      const icon = document.getElementById("scan-icon");
      const status = document.getElementById("scan-status");
      
      btn.disabled = true;
      icon.classList.add("animate-spin");
      analyzedResults = [];

      const tbody = document.getElementById("stock-table-body");
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-cyan-400 font-mono">正在透過 API 即時下載真實日 K 數據並執行 SMC 運算...</td></tr>`;

      for (let i = 0; i < TW_WATCHLIST.length; i++) {
        const item = TW_WATCHLIST[i];
        status.innerText = `正在分析 (${i + 1}/${TW_WATCHLIST.length}): ${item.symbol} ${item.name}...`;
        try {
          const klines = await fetchRealKlines(item.symbol);
          const result = analyzeSMC(item, klines);
          if (result) analyzedResults.push(result);
        } catch (e) {
          console.warn(`無法抓取 ${item.symbol}`, e);
        }
      }

      icon.classList.remove("animate-spin");
      btn.disabled = false;
      status.innerText = "全市場掃描完成！";
      renderResults();
    }

    // 渲染掃描結果
    function renderResults() {
      const tbody = document.getElementById("stock-table-body");
      tbody.innerHTML = "";
      document.getElementById("result-count").innerText = `共 ${analyzedResults.length} 檔`;

      // 優先依照風盈比排序
      analyzedResults.sort((a, b) => parseFloat(b.rr) - parseFloat(a.rr));

      analyzedResults.forEach((stock, idx) => {
        const tr = document.createElement("tr");
        tr.className = "cursor-pointer transition hover:bg-slate-800/60";
        tr.onclick = () => selectStock(stock);

        tr.innerHTML = `
          <td class="py-2.5 px-3">
            <span class="font-bold text-slate-100">${stock.symbol}</span>
            <span class="text-slate-400 font-sans ml-1">${stock.name}</span>
          </td>
          <td class="py-2.5 px-2 font-semibold text-slate-200">NT$ ${stock.currentPrice}</td>
          <td class="py-2.5 px-2">
            <span class="px-1.5 py-0.5 rounded text-[10px] font-sans ${stock.hasMSS ? 'bg-cyan-950 text-cyan-300 border border-cyan-500/30' : 'bg-slate-800 text-slate-400'}">
              ${stock.structure}
            </span>
          </td>
          <td class="py-2.5 px-2 text-indigo-300">${stock.fvgRange}</td>
          <td class="py-2.5 px-2 text-rose-400 font-medium">${stock.sl}</td>
          <td class="py-2.5 px-2 text-right">
            <span class="font-bold ${parseFloat(stock.rr) >= 2.0 ? 'text-emerald-400' : 'text-slate-400'}">
              1 : ${stock.rr}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      if (analyzedResults.length > 0) {
        selectStock(analyzedResults[0]);
      }
    }

    // 選取股票繪製走勢圖與細部規劃
    function selectStock(stock) {
      document.getElementById("chart-symbol").innerText = `${stock.symbol} ${stock.name}`;
      document.getElementById("chart-price").innerText = `NT$ ${stock.currentPrice}`;
      document.getElementById("chart-fvg-tag").innerText = stock.hasFVG ? `FVG 缺口: ${stock.fvgRange}` : "無顯著失衡";

      document.getElementById("plan-details").innerHTML = `
        <p>• <b>結構狀態</b>：${stock.structure}，位階判斷處於 ${stock.isDiscount ? '<span class="text-emerald-400 font-medium">折價區 (Discount Zone)</span>' : '<span class="text-amber-400 font-medium">均衡位之上 (Equilibrium)</span>'}。</p>
        <p>• <b>防守止損 (SL)</b>：設定於 <b>NT$ ${stock.sl}</b>（跌破近期波段結構低點即視為 SMC 結構失效出場）。</p>
        <p>• <b>目標止盈 (TP)</b>：上看外部買方流動性池 <b>NT$ ${stock.tp}</b>，預期風盈比達 <b>1 : ${stock.rr}</b>。</p>
      `;

      renderChart(stock);
    }

    // 繪製近 30 天真實日線收盤走勢
    function renderChart(stock) {
      const ctx = document.getElementById("realtimeChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      const labels = stock.klines.map(k => k.date);
      const closes = stock.klines.map(k => k.close);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${stock.symbol} 日收盤價`,
            data: closes,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.08)',
            borderWidth: 2,
            tension: 0.15,
            pointRadius: 2,
            pointHoverRadius: 5,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (c) => `收盤價: NT$ ${c.parsed.y}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(51, 65, 85, 0.2)' },
              ticks: { color: '#64748b', font: { family: 'monospace', size: 10 } }
            },
            y: {
              grid: { color: 'rgba(51, 65, 85, 0.2)' },
              ticks: {
                color: '#64748b',
                font: { family: 'monospace', size: 10 },
                callback: (v) => `NT$ ${v}`
              }
            }
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
