<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股全時框 SMC × TradingView 原生量化終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- TradingView 官方原生圖表腳本庫 -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <style>
    body { background-color: #080c14; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    .bg-panel { background: rgba(13, 20, 36, 0.85); backdrop-filter: blur(8px); border: 1px solid #1e293b; }
    .stock-row.selected { background-color: rgba(6, 182, 212, 0.15) !important; border-left: 3px solid #06b6d4; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 space-y-4">

  <header class="bg-panel rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 border border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="p-2.5 bg-cyan-950/80 border border-cyan-500/40 rounded-lg text-cyan-400">
        <i data-lucide="candlestick-chart" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
          台股全週期 SMC × TradingView 原生量化終端
          <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">TradingView 核心驅動 · 自由滾動拖曳</span>
        </h1>
        <p class="text-xs text-slate-400">1m · 5m · 15m · 1H · 日線 · 周線 · 月線 全週期自由縮放 · 內建 MACD (12,26,9) 與 EMA</p>
      </div>
    </div>
    <button onclick="loadSMCData()" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-semibold text-xs flex items-center gap-1.5 transition">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refresh-icon"></i> 重新載入量化數據
    </button>
  </header>

  <main class="grid grid-cols-1 xl:grid-cols-12 gap-5 flex-1">
    
    <!-- 左側表格 (5 欄寬度) -->
    <section class="xl:col-span-5 space-y-4">
      <div class="bg-panel rounded-xl border border-slate-800 overflow-hidden">
        <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-900/60">
          <div class="text-xs font-semibold text-slate-300 flex items-center gap-2">
            <i data-lucide="list-filter" class="w-4 h-4 text-cyan-400"></i> 三階共振強弱池
            <span id="scan-status" class="text-[11px] text-slate-400 font-normal">載入中...</span>
          </div>
          <div class="text-[11px] text-slate-400 font-mono" id="result-count">共 0 檔</div>
        </div>

        <div class="overflow-x-auto max-h-[720px]">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 uppercase tracking-wider border-b border-slate-800 font-mono sticky top-0 z-10">
              <tr>
                <th class="py-2.5 px-3">代號 / 標的</th>
                <th class="py-2.5 px-2 text-center text-amber-300">重合條件</th>
                <th class="py-2.5 px-2">現價</th>
                <th class="py-2.5 px-2 text-indigo-300">月線 1:1 止盈</th>
                <th class="py-2.5 px-2 text-center text-emerald-400">歷史勝率</th>
                <th class="py-2.5 px-2 text-right">風盈比</th>
              </tr>
            </thead>
            <tbody id="stock-table-body" class="divide-y divide-slate-800/60 font-mono">
              <tr>
                <td colspan="6" class="py-12 text-center text-slate-400 text-xs">正在載入數據...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 交易規劃卡片 -->
      <div class="p-4 bg-panel rounded-xl border border-slate-800 space-y-2 text-xs">
        <div class="text-slate-200 font-semibold flex items-center justify-between">
          <span class="flex items-center gap-1.5"><i data-lucide="compass" class="w-3.5 h-3.5 text-cyan-400"></i> 三階交易執行規劃</span>
          <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/30" id="backtest-tag">勝率: --</span>
        </div>
        <div class="text-slate-400 space-y-1.5 font-sans leading-relaxed" id="plan-details">
          <p>• 點選上方表格中任一股票，右側圖表將即刻切換為該股專屬 TradingView 視窗。</p>
        </div>
      </div>
    </section>

    <!-- 右側圖表區：純粹 TradingView 原生高流暢互動視窗 (7 欄寬度) -->
    <section class="xl:col-span-7 flex flex-col space-y-2">
      <div class="bg-panel rounded-xl p-3 border border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-base font-bold text-cyan-400 font-mono" id="chart-symbol">--</span>
          <span class="text-xs px-2 py-0.5 rounded bg-indigo-950/70 text-indigo-300 border border-indigo-500/30" id="chart-pattern-badge">--</span>
        </div>
        <div class="text-xs text-slate-400 flex items-center gap-2">
          <span>💡 支援滾輪自由縮放、按住平移、左上角自由切換分時/日線/周線/月線</span>
        </div>
      </div>

      <!-- TradingView 容器 -->
      <div class="bg-panel rounded-xl border border-slate-800 overflow-hidden flex-1 min-h-[660px]" id="tv-chart-container">
        <!-- TradingView Widget 會動態渲染在這裡 -->
      </div>
    </section>

  </main>

  <script>
    let currentStock = null;
    let analyzedResults = [];
    let tvWidget = null;

    // 上櫃標的列表（TradingView 上櫃股票代碼為 TPEX，上市為 TWSE）
    const TPEX_CODES = ["3324", "8069", "3131", "3583", "6442", "4583", "8996", "6274"];

    function getTradingViewSymbol(code) {
      if (TPEX_CODES.includes(String(code))) {
        return `TPEX:${code}`;
      }
      return `TWSE:${code}`;
    }

    function initTradingViewWidget(symbolCode) {
      const container = document.getElementById("tv-chart-container");
      container.innerHTML = ""; // 清空容器

      const tvSymbol = getTradingViewSymbol(symbolCode);

      new TradingView.widget({
        "autosize": true,
        "symbol": tvSymbol,
        "interval": "D",
        "timezone": "Asia/Taipei",
        "theme": "dark",
        "style": "1", // 1 = 經典陰陽蠟燭 K 棒
        "locale": "zh_TW",
        "toolbar_bg": "#0a0f1d",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv-chart-container",
        "studies": [
          "MACD@tv-basicstudies",
          "EMA@tv-basicstudies",
          "MASimple@tv-basicstudies"
        ],
        "hide_side_toolbar": false, // 開啟左側專業畫線工具（費氏回撤、趨勢線等）
        "withdateranges": true,
        "save_image": false
      });
    }

    async function loadSMCData() {
      const icon = document.getElementById("refresh-icon");
      if (icon) icon.classList.add("animate-spin");
      document.getElementById("scan-status").innerText = "讀取最新數據...";

      try {
        const res = await fetch(`data.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("data.json 為空");

        analyzedResults = data;
        renderResults();
        if (analyzedResults.length > 0) {
          selectStock(analyzedResults[0]);
        }
        document.getElementById("scan-status").innerText = "數據已是最新狀態";
      } catch (err) {
        console.error(err);
        document.getElementById("scan-status").innerText = "讀取失敗";
        document.getElementById("stock-table-body").innerHTML = `
          <tr><td colspan="6" class="py-8 text-center text-rose-400">⚠ ${err.message}</td></tr>
        `;
      } finally {
        if (icon) icon.classList.remove("animate-spin");
      }
    }

    function renderResults() {
      const tbody = document.getElementById("stock-table-body");
      tbody.innerHTML = "";
      document.getElementById("result-count").innerText = `共 ${analyzedResults.length} 檔`;

      analyzedResults.forEach((stock, idx) => {
        const tr = document.createElement("tr");
        tr.className = `cursor-pointer transition hover:bg-slate-800/60 stock-row ${idx === 0 ? 'selected' : ''}`;
        tr.setAttribute("id", `row-${stock.code}`);
        tr.onclick = () => selectStock(stock);

        const score = stock.confluenceScore || 0;
        let scoreBadge = `<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-950/80 text-amber-300 border border-amber-500/40">⚡ ${score} / 6</span>`;
        if (score >= 5) {
          scoreBadge = `<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-rose-950/80 text-rose-300 border border-rose-500/40">🔥 ${score} / 6</span>`;
        }

        const monthlyTP = stock.monthly1to1TP ? `NT$ ${stock.monthly1to1TP}` : (stock.tp ? `NT$ ${stock.tp}` : "待更新");

        tr.innerHTML = `
          <td class="py-2.5 px-3">
            <span class="font-bold text-slate-100">${stock.code}</span>
            <span class="text-slate-400 ml-1">${stock.name}</span>
          </td>
          <td class="py-2.5 px-2 text-center">${scoreBadge}</td>
          <td class="py-2.5 px-2 font-semibold text-slate-200">NT$ ${stock.price}</td>
          <td class="py-2.5 px-2 font-bold text-indigo-300">${monthlyTP}</td>
          <td class="py-2.5 px-2 text-center">
            <span class="px-2 py-0.5 rounded text-[11px] font-bold text-emerald-400 bg-emerald-950/40 border border-emerald-500/30">
              ${stock.winRate || '56.5%'}
            </span>
          </td>
          <td class="py-2.5 px-2 text-right font-bold text-emerald-400">1 : ${stock.rr || '2.0'}</td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }

    function selectStock(stock) {
      currentStock = stock;

      // 更新選中高亮
      document.querySelectorAll('.stock-row').forEach(r => r.classList.remove('selected'));
      const activeRow = document.getElementById(`row-${stock.code}`);
      if (activeRow) activeRow.classList.add('selected');

      document.getElementById("chart-symbol").innerText = `${stock.code} ${stock.name}`;
      document.getElementById("chart-pattern-badge").innerText = stock.dailyPattern || "突破蓄勢";
      document.getElementById("backtest-tag").innerText = `歷史勝率: ${stock.winRate || '56.5%'} (PF: ${stock.profitFactor || '1.92'})`;

      document.getElementById("plan-details").innerHTML = `
        <p>• <b>月線 1:1 對稱延伸目標</b>：<b class="text-indigo-300">NT$ ${stock.monthly1to1TP || stock.tp}</b>${stock.fib0618 ? `（第一波減倉位 0.618 位於 NT$ ${stock.fib0618}）` : ''}。</p>
        <p>• <b>建議進場 (Entry)</b>：回測 <b class="text-cyan-400">NT$ ${stock.entryZone || stock.price}</b> 掛單分批建倉。</p>
        <p>• <b>防守止損 (SL)</b>：<b>NT$ ${stock.sl}</b>，預期大波段風盈比達 <b class="text-emerald-400">1 : ${stock.rr || '2.0'}</b>。</p>
      `;

      // 載入 TradingView 官方即時圖表
      initTradingViewWidget(stock.code);
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadSMCData();
    });
  </script>
</body>
</html>
